<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<title>Gym Exercises</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0b1220;--card:#131e30;--line:#26364e;--text:#edf2f7;--mute:#9fb0c6;--acc:#35c58a;--acc2:#1fa0ff;--in:#0c1524;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0b1220}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:84px}
.app{max-width:640px;margin:auto;padding:14px}
.hero{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#16314a,#13283f 60%,#0f3a33);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}
.logo{width:54px;height:54px;flex:none}
.hero h1{font-size:19px;margin:0;letter-spacing:.3px}
.hero small{color:var(--mute)}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#20324a;border:2px solid var(--acc);margin-inline-start:auto;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:5px 11px;border-radius:30px;background:#164b3b;color:#a8f0d1;font-weight:700}
.tag.rest{background:#344155;color:#d0d9e5}
.prog{height:8px;background:var(--line);border-radius:20px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.mute{color:var(--mute);font-size:13px;line-height:1.7}
.ex h3{margin:0 0 10px;font-size:16px}
.set{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #2b3a50}
.set b{font-size:13px;color:var(--acc);width:52px}
.w{display:flex;align-items:center;gap:6px;background:var(--in);border:1px solid #40516a;border-radius:12px;padding:0 10px}
.w input{width:100%;background:none;border:0;color:#fff;font:inherit;font-size:17px;padding:10px 0;outline:0;text-align:center}
.w span{color:var(--mute);font-size:12px}
.rep{display:flex;align-items:center;gap:6px}
.rep button{width:38px;height:38px;border-radius:12px;border:0;background:#263a55;color:#fff;font-size:22px;font-weight:700}
.rep button.p{background:#167653}
.rep output{min-width:30px;text-align:center;font-size:19px;font-weight:800}
.btn{border:0;border-radius:12px;padding:12px 16px;background:#263a55;color:#f4f7fb;font:inherit;font-weight:700}
.btn.pri{background:#167653}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;line-height:1.6}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex:none;margin-top:3px}
.day{display:flex;align-items:center;gap:10px;padding:15px 0;border-top:1px solid #2b3a50;cursor:pointer;font-size:17px}
.day:first-of-type{border:0}.day.now{color:var(--acc)}
.day em{margin-inline-start:auto;font-style:normal;font-size:12px;color:var(--mute)}
nav{position:fixed;inset:auto 0 0 0;background:#0f1a2b;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--mute);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 18px;border-radius:12px}
nav button span{font-size:21px}nav button.on{color:var(--acc);background:#16283d}
.pf{text-align:center}.pf img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);background:#20324a}
.pf input[type=text]{width:100%;margin:14px 0;background:var(--in);color:#fff;border:1px solid #40516a;border-radius:12px;padding:13px;font:inherit;font-size:17px;text-align:center}
.hide{display:none!important}
.md{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.box{background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:640px;max-height:88vh;overflow:auto;line-height:1.85}
.box h3{margin:0 0 6px}.box p{margin:10px 0}.box b.s{color:var(--acc)}
#rm{position:fixed;top:0;inset-inline:0;z-index:60;background:linear-gradient(90deg,#167653,#1fa0ff);color:#fff;font-weight:800;text-align:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px;font-size:17px}
</style>
</head>
<body><main class="app">
<header class="hero">
<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35c58a"/><stop offset="1" stop-color="#1fa0ff"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="#0b1220"/><rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#g)" stroke-width="2.5"/><g fill="url(#g)"><rect x="7" y="25" width="5" height="14" rx="2"/><rect x="52" y="25" width="5" height="14" rx="2"/><rect x="13" y="19" width="8" height="26" rx="3"/><rect x="43" y="19" width="8" height="26" rx="3"/><rect x="21" y="30" width="22" height="4" rx="2"/></g></svg>
<div><h1>Gym Exercises</h1><small id="hello">أهلاً بك</small></div>
<img class="avatar" id="av" alt="">
</header>

<section id="t-today" class="hide"><div class="row" style="margin-bottom:12px"><button class="btn" id="back">→ الأسبوع</button><button class="btn" id="reset" style="margin-inline-start:auto">مسح اليوم</button></div>
<div class="card"><div class="row"><b id="dname" style="font-size:18px"></b><span class="tag" id="dtag"></span></div>
<div class="prog"><i id="bar"></i></div><div class="mute" id="pt"></div></div>
<div id="list"></div>
<div class="card hide" id="cardio"><b>🏃 الكارديو بعد الحديد</b>
<label class="chk"><input type="checkbox" data-c="0"><span>10 دقائق مشي جبلي بميلان 6-10%</span></label>
<label class="chk"><input type="checkbox" data-c="1"><span>15 دقيقة مشي سريع بميلان 1-3%</span></label>
<label class="chk"><input type="checkbox" data-c="2"><span>2-3 دقائق تهدئة</span></label></div>
<div class="card hide" id="restc"><b>😴 يوم راحة</b><p class="mute">راحة واستشفاء. مشي خفيف اختياري.</p></div>
</section>

<section id="t-week"><div class="card"><b>جدول الأسبوع</b><p class="mute" style="margin:6px 0 0">اضغط على اليوم لعرض تمارينه</p><div id="wk"></div></div><div class="card"><b>🔔 تذكير الجم</b><p class="mute" id="rs">في أيام التمرين الساعة 6:00 مساءً يظهر تنبيه «حان وقت الذهاب للجم» عند فتح التطبيق.</p><button class="btn pri" id="rb">السماح بالإشعارات</button></div>
</section>

<section id="t-me" class="hide"><div class="card pf">
<img id="pimg" alt=""><div style="margin-top:12px"><label class="btn pri" for="file">اختيار صورة</label><input id="file" type="file" accept="image/*" hidden></div>
<input id="nm" type="text" placeholder="اكتب اسمك" maxlength="30">
<button class="btn pri" id="save">حفظ</button></div></section>
</main>
<div id="rm" class="hide"></div><div class="md hide" id="md"><div class="box" id="mb"></div></div>
<nav><button data-t="week" class="on"><span>📅</span>الأسبوع</button><button data-t="me"><span>👤</span>حسابي</button></nav>
<script>
const FR=["صدر مستوي","صدر علوي","كتف جانبي","تراي","تراي خلف الرأس","تمرين بطن","كتف أمامي","سواعد أمامية — دمبل","سواعد بالبار","أفخاذ خارجية","أفخاذ أمامية"];
const BK=["ليت بول داون","بلوفر","بكرة ظهر علوي","ظهر سفلي","كتف خلفي","باي بكرة","باي كالس — وسط الباي والتراي","سواعد بكرة","أفخاذ داخلية","كلوز بار","أفخاذ خلفية","تمرين عضلة الكولف"];
const DAYS=[["الأحد","f"],["الاثنين","b"],["الثلاثاء","f"],["الأربعاء","r"],["الخميس","f"],["الجمعة","r"],["السبت","b"]];
const TN={f:"أمامي",b:"خلفي",r:"راحة"};
const $=id=>document.getElementById(id);
let S={profile:{name:"",photo:""},logs:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("gymEx")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("gymEx",JSON.stringify(S))}catch(e){}};
let cur=new Date().getDay();const dkOf=i=>{const d=new Date(),n=d.getDay();d.setDate(d.getDate()+((i-5+7)%7)-((n-5+7)%7));return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};const dk=()=>dkOf(cur);
const dayLog=k=>S.logs[k]||(S.logs[k]={ex:{},c:[]});
const ph="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='#20324a'/><circle cx='32' cy='24' r='11' fill='#6f86a3'/><path d='M10 58c2-14 12-20 22-20s20 6 22 20z' fill='#6f86a3'/></svg>");
function profile(){const n=S.profile.name;$("hello").textContent=n?"أهلاً، "+n:"أهلاً بك";$("av").src=$("pimg").src=S.profile.photo||ph;$("nm").value=n}
function today(){
const i=cur,[nm,t]=DAYS[i],L=dayLog(dk()),list=t==="f"?FR:BK;
$("dname").textContent=nm;$("dtag").textContent=TN[t];$("dtag").className="tag"+(t==="r"?" rest":"");
$("restc").classList.toggle("hide",t!=="r");$("cardio").classList.toggle("hide",t==="r");
$("list").innerHTML=t==="r"?"":list.map((n,x)=>{const e=L.ex[x]||[{},{}];return`<div class="card ex"><h3 data-e="${x}" style="cursor:pointer">${x+1}. ${n} <span style="color:var(--acc);font-size:13px">ⓘ</span></h3>`+[0,1].map(s=>{const v=e[s]||{};return`<div class="set"><b>مجموعة ${s+1}</b><label class="w"><input type="number" inputmode="decimal" min="0" step="0.5" placeholder="0" value="${v.w||""}" data-x="${x}" data-s="${s}"><span>كغم</span></label><div class="rep"><button data-m="${x},${s},-1">−</button><output>${v.r||0}</output><button class="p" data-m="${x},${s},1">+</button></div></div>`}).join("")+`</div>`}).join("");
document.querySelectorAll("[data-c]").forEach(c=>c.checked=!!L.c[c.dataset.c]);
prog(list,L,t)}
function prog(list,L,t){let tot=t==="r"?0:list.length*2,d=0;for(const x in L.ex)L.ex[x].forEach(s=>{if(s&&s.r>0)d++});
$("bar").style.width=tot?Math.min(100,d/tot*100)+"%":"0";$("pt").textContent=tot?`${d} من ${tot} مجموعات مكتملة`:"لا توجد تمارين اليوم"}
function setv(x,s,k,v){const L=dayLog(dk());const e=L.ex[x]||(L.ex[x]=[{},{}]);e[s][k]=v;save()}
$("list").addEventListener("input",e=>{const t=e.target;if(t.dataset.x!=null)setv(t.dataset.x,+t.dataset.s,"w",t.value)});
$("list").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;const[x,s,d]=b.dataset.m.split(",").map(Number);
const L=dayLog(dk());const e2=L.ex[x]||(L.ex[x]=[{},{}]);const r=Math.max(0,(e2[s].r||0)+d);setv(x,s,"r",r);
b.parentNode.querySelector("output").textContent=r;const t=DAYS[cur][1];prog(t==="f"?FR:BK,L,t)});
document.querySelectorAll("[data-c]").forEach(c=>c.onchange=()=>{dayLog(dk()).c[c.dataset.c]=c.checked;save()});
function week(){const n=new Date().getDay();$("wk").innerHTML=[5,6,0,1,2,3,4].map(i=>{const[a,t]=DAYS[i],L=S.logs[dkOf(i)];let d=0;if(L)for(const x in L.ex)L.ex[x].forEach(s=>{if(s&&s.r>0)d++});const tot=t==="r"?0:(t==="f"?FR:BK).length*2;return`<div class="day ${i===n?"now":""}" data-d="${i}" role="button"><b>${a}</b><span class="tag ${t==="r"?"rest":""}">${TN[t]}</span><em>${i===n?"اليوم • ":""}${tot?d+"/"+tot:""} ‹</em></div>`}).join("")}
$("wk").onclick=e=>{const r=e.target.closest("[data-d]");if(!r)return;cur=+r.dataset.d;today();$("t-week").classList.add("hide");$("t-today").classList.remove("hide");scrollTo(0,0)};
$("back").onclick=()=>document.querySelector('nav button[data-t="week"]').click();
$("reset").onclick=()=>{if(confirm("مسح أوزان وتكرارات اليوم؟")){delete S.logs[dk()];save();today()}};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));["today","week","me"].forEach(t=>$("t-"+t).classList.toggle("hide",t!==b.dataset.t));if(b.dataset.t==="week")week()});
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=256;const m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);S.profile.photo=c.toDataURL("image/jpeg",.85);save();profile()};im.src=URL.createObjectURL(f)};
$("save").onclick=()=>{S.profile.name=$("nm").value.trim();save();profile();$("save").textContent="تم الحفظ ✓";setTimeout(()=>$("save").textContent="حفظ",1200)};
const T={f:[
["press","جهاز ضغط الصدر (أو بنش مستوٍ): اضبط المقعد ليكون المقبضان بمستوى منتصف الصدر، والصق ظهرك وكتفيك بالمسند.","ادفع المقبضين للأمام حتى تمتد الذراعان دون قفل المرفقين، ثم ارجع ببطء خلال 2-3 ثوانٍ حتى تشعر بتمدد الصدر. زفير عند الدفع وشهيق عند الرجوع.","رفع الكتفين نحو الأذنين، أو ارتداد الوزن عن الصدر."],
["press","جهاز ضغط الصدر العلوي (أو بنش مائل 30-45°): اضبط المقعد ليكون المقبضان عند أعلى الصدر قرب الترقوة.","ادفع للأعلى والأمام بزاوية مائلة حتى امتداد الذراعين، توقف لحظة، ثم ارجع ببطء مع إبقاء الصدر مرفوعاً.","زاوية مائلة فوق 45° تنقل الجهد إلى الكتف، وكذلك تقوس أسفل الظهر."],
["raise","جهاز الرفرفة الجانبية للكتف: اجلس بظهر ثابت وضع الوسادتين على الجزء الخارجي من الذراع قرب المرفق.","ارفع الذراعين جانباً حتى مستوى الكتفين فقط، ثبّت ثانية، ثم انزل ببطء دون أن تترك الوزن يسقط.","الرفع فوق مستوى الكتف، أو تحريك الجذع لمساعدة الوزن."],
["ext","جهاز الكابل (Push-down) بمقبض حبل أو بار: قف قريباً من الجهاز والمرفقان ملاصقان للجسم.","ادفع للأسفل حتى تمتد الذراعان بالكامل واعصر الترايسبس ثانية، ثم ارجع حتى زاوية 90° عند المرفق دون رفعه.","تحريك المرفقين للأمام والخلف، أو الاتكاء بالجذع على الوزن."],
["ext","كابل أو دمبل خلف الرأس: امسك الحبل أو الدمبل خلف الرأس والمرفقان للأعلى بجانب الأذنين.","مدّ الذراعين للأعلى حتى الاستقامة، ثم انزل ببطء خلف الرأس حتى تشعر بتمدد الترايسبس. المرفقان ثابتان طوال الحركة.","فتح المرفقين للخارج، أو تقوس أسفل الظهر مع الوزن الثقيل."],
["core","جهاز كرنش البطن: اضبط الوزن، اجلس وامسك المقبضين عند الصدر والوركان ثابتان على المقعد.","قوّس الجذع للأمام بتقريب القفص الصدري من الحوض مع زفير، اعصر البطن ثانية، ثم ارجع ببطء دون ترك الوزن.","السحب بالذراعين بدل البطن، أو الحركة من الورك."],
["press","جهاز ضغط الكتف: اضبط المقعد ليكون المقبضان بمستوى الذقن تقريباً، وظهرك ثابت على المسند.","ادفع للأعلى حتى قرب امتداد الذراعين دون قفل المرفقين، ثم انزل ببطء حتى مستوى الأذنين.","تقوس الظهر، أو إنزال الوزن بسرعة."],
["curl","سواعد أمامية بدمبل: اجلس وأسند الساعد على الفخذ أو البنش، الكف للأعلى والمعصم خارج الحافة.","أنزل الدمبل بمرونة المعصم ثم اثنِ المعصم للأعلى بأقصى مدى، اعصر الساعد ثانية، وكرر بتحكم.","رفع الساعد عن الإسناد، أو استخدام وزن يمنع المدى الكامل."],
["curl","سواعد بالبار: اجلس وأسند الساعدين على الفخذين والمعصمان خارج الركبتين، قبضة كف للأعلى.","أنزل البار حتى أطراف الأصابع ثم اثنِ المعصمين للأعلى بالكامل، ثبّت ثانية وانزل ببطء.","الأرجحة بالجذع، وتحريك المرفقين."],
["legs","جهاز إبعاد الفخذ (Abductor): اجلس بظهر ثابت والوسادتان على الجهة الخارجية للركبتين.","افتح الساقين للخارج ببطء حتى أقصى مدى مريح، توقف ثانية، ثم ارجع بتحكم دون أن تضرب الأوزان.","الاندفاع بسرعة، أو ترك الوزن يعيد الساقين."],
["legs","جهاز تمديد الساق (Leg Extension): اضبط المسند ليكون الركبة عند محور الجهاز والوسادة فوق الكاحل.","مدّ الساقين حتى الاستقامة دون قفل عنيف، اعصر الفخذ الأمامي ثانية، ثم انزل ببطء 2-3 ثوانٍ.","رفع الورك عن المقعد، أو وزن كبير يجعلك ترتد."]
],b:[
["pull","جهاز السحب العلوي (Lat Pulldown): اضبط وسادة الفخذين، وامسك البار بعرض أوسع من الكتفين.","اسحب البار إلى أعلى الصدر مع إخراج الصدر وجمع لوحي الكتف، ثبّت ثانية، ثم ارجع حتى امتداد الذراعين ببطء.","الميل الشديد للخلف، أو السحب خلف الرأس، أو السحب بالذراعين فقط."],
["pull","بلوفر (Pullover) بجهاز أو كابل: اضبط المقعد ليكون محور الدوران عند الكتف.","اسحب المقبض نحو الورك بذراعين شبه ممدودتين وبقوة الظهر، ثم ارجع ببطء حتى تمدد الظهر.","ثني المرفقين كثيراً فيتحول التمرين إلى ترايسبس."],
["pull","بكرة ظهر علوي (Seated Row): اجلس بصدر مرتفع وقدماك على المسند والركبتان مرنتان.","اسحب المقبض نحو أسفل الصدر مع جمع لوحي الكتف، ثبّت ثانية، ثم ارجع ببطء حتى تمتد الذراعان.","الأرجحة بالجذع، أو رفع الكتفين."],
["core","جهاز الظهر السفلي (Back Extension): اضبط الوسادة على أعلى الفخذين والورك عند حافة الوسادة.","انزل بظهر مستقيم ثم ارفع الجذع حتى استقامة الجسم فقط مع زفير، وانزل ببطء.","الإفراط في تقوس الظهر للخلف، أو وزن ثقيل جداً."],

["curl","باي بكرة بالكابل: قف أمام الجهاز والمرفقان ثابتان بجانب الجسم والكفان للأعلى.","اثنِ الذراعين حتى انقباض الباي كاملاً، ثم انزل ببطء كامل حتى الامتداد.","أرجحة الظهر، أو تحريك المرفقين للأمام."],
["curl","تمرين وسط الباي والتراي على الكابل: ثبّت المرفقين بجانب الجسم بمقبض حبل وقبضة محايدة (مطرقة).","للباي: اثنِ الذراعين للأعلى ببطء. وللتراي: ادفع للأسفل حتى الامتداد. افصل بين الحركتين وتحكم في الرجوع.","استخدام الجسم لمساعدة الحركة، أو وزن يمنع التحكم."],
